name: DSH adapter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dsh-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
